; Standard: Steckbrett-Verdrahtung (README Kap. 4)   -> pio run -t upload
; Shield:   Lochraster-Shield      (README Kap. 5)   -> pio run -e shield -t upload
[platformio]
default_envs = megaatmega2560

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200

[env:shield]
extends = env:megaatmega2560
build_flags = -DSHIELD
